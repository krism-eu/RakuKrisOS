[package]
name = "rakuos-pkgmgr"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rakuos-install"
path = "src/bin/install.rs"

[[bin]]
name = "rakuos-remove"
path = "src/bin/remove.rs"

[[bin]]
name = "rakuos-list"
path = "src/bin/list.rs"

[[bin]]
name = "rakuos-update"
path = "src/bin/update.rs"

[[bin]]
name = "rakuos-updater"
path = "src/bin/updater.rs"

[[bin]]
name = "rakuos-cache-clean"
path = "src/bin/cache_clean.rs"

[[bin]]
name = "rakupkg"
path = "src/bin/rakupkg.rs"

[dependencies]
rakuos-overlay = { path = "../overlay" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
inotify = "0.10"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"], default-features = false }
