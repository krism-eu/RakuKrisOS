# ─────────────────────────────────────────────────────────────────────────────
# RakuOS Core — build RPMs and publish them to the rakurpm repo server.
#
# ▶ REQUIRED CI/CD VARIABLES (Settings → CI/CD → Variables):
#     RAKURPM_IP             — rakurpm server direct IP                (Masked + Protected)
#     RAKURPM_ADMIN_PREFIX   — admin path the upload API is under      (default /backend)
#     RAKURPM_TOKEN          — app upload bearer token                 (Masked + Protected)
# ─────────────────────────────────────────────────────────────────────────────

stages: [build, sync]

build:rpm:
  stage: build
  image: $BUILD_IMAGE
  tags: [saas-linux-2xlarge-amd64]
  interruptible: true
  timeout: 30 minutes
  variables:
    SPEC: data/rakuos-core.spec
    PKG_NAME: rakuos-core
  parallel:
    matrix:
      - { TARGET: rakuos-44,      BUILD_IMAGE: "registry.fedoraproject.org/fedora:44",      TARGET_REPO: "rakuos-44",      DELAY_SECONDS: "0",
          EXTRA_DNF_SETUP: "rpm --import https://repo.rakuos.org/pubkey.gpg && dnf5 -y config-manager addrepo --from-repofile=https://repo.rakuos.org/rakuos.repo" }
      - { TARGET: rakuos-el-10,   BUILD_IMAGE: "quay.io/centos/centos:stream10",            TARGET_REPO: "rakuos-el-10",   DELAY_SECONDS: "120",
          EXTRA_DNF_SETUP: "dnf config-manager --set-enabled crb && dnf -y install epel-release && dnf config-manager --add-repo https://repo.rakuos.org/rakuos-el.repo" }
  cache:
    key: "cargo-$TARGET"
    paths:
      - .cargo/registry/cache/
      - .cargo/registry/index/
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "**/*"
        - "!LICENSE"
        - "!*.md"
        - "!**/*.md"
        - "!.gitlab-ci.yml"
  before_script:
    - |
      set -euo pipefail
      if [ "${DELAY_SECONDS:-0}" -gt 0 ]; then
        echo "== Stagger delay: sleeping ${DELAY_SECONDS}s before starting $TARGET =="
        sleep "$DELAY_SECONDS"
      fi
      echo "== Installing build tooling for $TARGET =="
      dnf -y install rpm-build rpmdevtools dnf-plugins-core git curl jq >/dev/null
      dnf -y install dnf5-plugins >/dev/null 2>&1 || true
      [ -n "${EXTRA_DNF_SETUP:-}" ] && eval "$EXTRA_DNF_SETUP" || true
  script:
    - |
      set -euo pipefail
      : "${RAKURPM_TOKEN:?set RAKURPM_TOKEN (Masked) in CI/CD variables}"
      : "${RAKURPM_IP:?set RAKURPM_IP (rakurpm server direct IP) in CI/CD variables}"
      ADMIN="${RAKURPM_ADMIN_PREFIX:-/backend}"
      export CARGO_HOME="$CI_PROJECT_DIR/.cargo"

      TOPDIR="$CI_PROJECT_DIR/rpmbuild"
      mkdir -p "$TOPDIR"/{SOURCES,SPECS,BUILD,RPMS,SRPMS}

      # 1. Source0 = GitLab archive zip, named to match %autosetup -n PKG_NAME-main
      echo "== Fetching source archive =="
      curl -fsSL "https://gitlab.com/rakuos/apps/${PKG_NAME}/-/archive/main/${PKG_NAME}-main.zip" \
        -o "$TOPDIR/SOURCES/${PKG_NAME}-main.zip"

      # 2. Install BuildRequires and build
      echo "== Installing BuildRequires =="
      dnf -y builddep "$SPEC"
      echo "== rpmbuild =="
      rpmbuild -bb --define "_topdir $TOPDIR" "$SPEC"

      # 3. Upload to rakurpm
      UPLOAD_URL="https://$RAKURPM_IP$ADMIN/api/repos/$TARGET_REPO/packages"
      echo "== Upload endpoint: $UPLOAD_URL =="
      : > /tmp/built_names
      : > /tmp/uploaded_files
      uploaded=0
      for rpm in $(find "$TOPDIR/RPMS" -type f -name '*.rpm' ! -name '*-debuginfo-*' ! -name '*-debugsource-*'); do
        echo "↑ $(basename "$rpm")"
        touch /tmp/rpm_resp
        code=$(curl -k -s -o /tmp/rpm_resp -w '%{http_code}' \
          -H "Authorization: Bearer $RAKURPM_TOKEN" \
          -F "file=@${rpm}" \
          -F "source=GitLab CI/CD" \
          "$UPLOAD_URL") || code=000
        echo "   HTTP $code"
        if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
          echo "   ----- response body (500B) -----"; head -c 500 /tmp/rpm_resp || true; echo
          exit 1
        fi
        rpm -qp --nosignature --qf '%{NAME}\n' "$rpm" >> /tmp/built_names 2>/dev/null || true
        echo "   response: $(cat /tmp/rpm_resp)"
        jq -r '.package // empty' /tmp/rpm_resp >> /tmp/uploaded_files 2>/dev/null || true
        echo "   tracked as: $(tail -1 /tmp/uploaded_files)"
        uploaded=$((uploaded + 1))
      done
      [ "$uploaded" -gt 0 ] || { echo "ERROR: no RPMs were built"; exit 1; }
      echo "== Uploaded $uploaded package(s) to '$TARGET_REPO' =="

      # 4. Prune previous versions
      echo "== Pruning previous versions in '$TARGET_REPO' =="
      curl -k -s -H "Authorization: Bearer $RAKURPM_TOKEN" \
        "https://$RAKURPM_IP$ADMIN/api/repos/$TARGET_REPO" -o /tmp/repo.json || true
      jq -r '.packages[].name' /tmp/repo.json > /tmp/repo_files 2>/dev/null || : > /tmp/repo_files
      : > /tmp/to_delete
      while read -r name; do
        [ -n "$name" ] || continue
        while read -r f; do
          grep -qxF "$f" /tmp/uploaded_files || echo "$f" >> /tmp/to_delete
        done < <(grep -E "^${name}-[0-9]" /tmp/repo_files 2>/dev/null || true)
      done < <(sort -u /tmp/built_names)
      if [ -s /tmp/to_delete ]; then
        sort -u /tmp/to_delete -o /tmp/to_delete
        echo "Deleting $(wc -l < /tmp/to_delete) previous package(s):"; sed 's/^/   - /' /tmp/to_delete
        FILES_JSON=$(jq -R -s 'split("\n") | map(select(length>0))' /tmp/to_delete)
        curl -k -s -X POST \
          -H "Authorization: Bearer $RAKURPM_TOKEN" -H "Content-Type: application/json" \
          --data "{\"files\": $FILES_JSON}" \
          "https://$RAKURPM_IP$ADMIN/api/repos/$TARGET_REPO/packages/delete" || true
      else
        echo "No previous versions to prune."
      fi

  artifacts:
    paths:
      - rpmbuild/RPMS/
    expire_in: 1 week

sync:repos:
  stage: sync
  image: alpine:latest
  tags: [saas-linux-small-amd64]
  needs:
    - job: build:rpm
      optional: true
  script:
    - apk add --no-cache curl
    - ADMIN=${RAKURPM_ADMIN_PREFIX:-/backend}
    - echo "== Triggering sync for all pending repos =="
    - |
      curl -k -sf -X POST \
        -H "Authorization: Bearer $RAKURPM_TOKEN" \
        "https://$RAKURPM_IP$ADMIN/api/sync-pending"
    - echo "== Sync complete =="
