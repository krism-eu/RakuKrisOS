# ─────────────────────────────────────────────────────────────────────────────
# rakuos-ostree — build ostree with SELinux support compiled out.
#
# RakuOS fully removes selinux-policy (AppArmor is the sole MAC), but stock
# ostree is built with HAVE_SELINUX and unconditionally shells out to
# `semodule -N --refresh` during ostree-finalize-staged.service whenever
# /etc/selinux/config exists in the new deployment — regardless of whether a
# real policy is loaded. With no policy backing it, that call fails and
# aborts deployment finalization. Building with --without-selinux compiles
# that code path out entirely (see configure.ac: AC_ARG_WITH(selinux, ...)),
# rather than patching source or working around it with file removal.
#
# Source: Fedora SRPM (spec + patches + tarball, pre-assembled), pulled from
# whichever Fedora release SRPM_RELEASEVER names below — normally "rawhide",
# but flip it to a stable release number (e.g. "44") if rawhide's ostree
# package ever falls behind that release's version, and back again once
# rawhide catches back up.
#
# ▶ REQUIRED CI/CD VARIABLES (Settings → CI/CD → Variables):
#     RAKURPM_IP             — rakurpm server direct IP                (Masked + Protected)
#     RAKURPM_ADMIN_PREFIX   — admin path the upload API is under      (default /backend)
#     RAKURPM_TOKEN          — app upload bearer token                 (Masked + Protected)
# ─────────────────────────────────────────────────────────────────────────────

stages: [build, sync]

build:rpm:
  stage: build
  image: $BUILD_IMAGE
  tags: [saas-linux-2xlarge-amd64]
  interruptible: true
  timeout: 120 minutes
  parallel:
    matrix:
      - TARGET: rakuos-44
        BUILD_IMAGE: "registry.fedoraproject.org/fedora:44"
        TARGET_REPO: "rakuos-44"
        RAKUOS_RELEASEVER: "44"
        # Which Fedora release the ostree SRPM is downloaded from — "rawhide"
        # or a stable release number like "44". Swap this when one falls
        # behind the other in package version (see header comment above).
        SRPM_RELEASEVER: "rawhide"
        DELAY_SECONDS: "0"

  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - "**/*"
        - "!*.md"
        - "!.gitlab-ci.yml"

  before_script:
    - |
      set -euo pipefail
      if [ "${DELAY_SECONDS:-0}" -gt 0 ]; then
        echo "== Stagger delay: sleeping ${DELAY_SECONDS}s =="
        sleep "$DELAY_SECONDS"
      fi

      echo "== Adding RakuOS repo =="
      rpm --import https://repo.rakuos.org/pubkey.gpg
      dnf5 -y config-manager addrepo --id=rakuos \
        --set=baseurl="https://repo.rakuos.org/rakuos/${RAKUOS_RELEASEVER}/" \
        --set=gpgcheck=1 --set=gpgkey=https://repo.rakuos.org/pubkey.gpg 2>/dev/null || \
        dnf -y config-manager --add-repo "https://repo.rakuos.org/rakuos/${RAKUOS_RELEASEVER}/"

      echo "== Adding Fedora ${SRPM_RELEASEVER:-rawhide} repo for SRPM download =="
      if [ "${SRPM_RELEASEVER:-rawhide}" = "rawhide" ]; then
        dnf -y install fedora-repos-rawhide 2>/dev/null || true
        dnf config-manager --set-enabled rawhide 2>/dev/null || true
      else
        dnf config-manager --set-enabled "fedora-source" "updates-source" 2>/dev/null || true
      fi

      echo "== Installing build tooling =="
      # selinux-policy-targeted is needed in the build ENVIRONMENT only —
      # rpm's own %install brp scripts (linkdupes --brp) call selabel_open()
      # unconditionally as part of build-root post-processing, regardless of
      # whether the package being built has SELinux support compiled in.
      # Without a real policy present here, that call fails with
      # "selabel_open() failed: No such file or directory" and aborts the
      # build before our --without-selinux flag ever matters.
      dnf -y install \
        rpm-build rpmdevtools dnf-plugins-core \
        git curl jq diffutils cpio tar util-linux \
        selinux-policy-targeted \
        >/dev/null

  script:
    - |
      set -euo pipefail
      exec > >(tee "$CI_PROJECT_DIR/full-build.log") 2>&1
      set -x
      : "${RAKURPM_TOKEN:?set RAKURPM_TOKEN in CI/CD variables}"
      : "${RAKURPM_IP:?set RAKURPM_IP in CI/CD variables}"
      ADMIN="${RAKURPM_ADMIN_PREFIX:-/backend}"

      TOPDIR="$CI_PROJECT_DIR/rpmbuild"
      mkdir -p "$TOPDIR"/{SOURCES,SPECS,BUILD,RPMS,SRPMS,EXTRACT}

      # ── 1. Download Fedora ostree SRPM ──────────────────────────────────────
      echo "== Downloading Fedora ${SRPM_RELEASEVER:-rawhide} ostree SRPM =="
      if [ "${SRPM_RELEASEVER:-rawhide}" = "rawhide" ]; then
        dnf download --source ostree \
          --enablerepo=rawhide --enablerepo=rawhide-source \
          --destdir="$TOPDIR/SRPMS" -y 2>/dev/null || \
        dnf download --source ostree \
          --enablerepo=rawhide \
          --destdir="$TOPDIR/SRPMS" -y
      else
        dnf download --source ostree \
          --releasever="$SRPM_RELEASEVER" \
          --enablerepo=fedora-source --enablerepo=updates-source \
          --destdir="$TOPDIR/SRPMS" -y
      fi
      SRPM=$(ls "$TOPDIR/SRPMS"/ostree-*.src.rpm | head -1)
      echo "== Using SRPM: $(basename "$SRPM") =="

      # Extract SRPM contents
      cd "$TOPDIR/EXTRACT"
      rpm2cpio "$SRPM" | cpio -idm 2>/dev/null
      mv ostree.spec "$TOPDIR/SPECS/"
      find . -maxdepth 1 -type f -exec mv {} "$TOPDIR/SOURCES/" \;
      cd "$CI_PROJECT_DIR"

      # ── 1b. Force a Release that outranks Fedora's stock package ────────────
      # The spec uses "Release: %autorelease" (rpmautospec), which only
      # resolves correctly inside Fedora's own koji/CI. Outside that context
      # it either fails or falls back to something like "1%{?dist}" — the
      # exact same Release Fedora's own build produced, so our rebuilt
      # package has an IDENTICAL NVR to the already-installed stock one.
      # `dnf5 upgrade` then correctly sees nothing newer to upgrade to,
      # even though the RPM contents differ (SELinux compiled out). Force a
      # literal Release comfortably higher than any Fedora release number so
      # our build always wins the upgrade comparison.
      echo "== Forcing Release to outrank stock Fedora ostree =="
      sed -i 's/^Release:.*/Release: 100.rakuos%{?dist}/' "$TOPDIR/SPECS/ostree.spec"
      grep -n '^Release' "$TOPDIR/SPECS/ostree.spec"

      # ── 2. Disable SELinux support in the spec ──────────────────────────────
      # Fedora's ostree.spec passes --with-selinux directly in the %configure
      # invocation (no bcond involved, confirmed against the rawhide dist-git
      # spec). Flip it to --without-selinux so HAVE_SELINUX is never defined
      # and the SELinux-aware finalize-deployment code path is compiled out.
      # Fall back to appending the flag if the line's form ever changes.
      echo "== Disabling SELinux in ostree spec =="
      if grep -q -- '--with-selinux' "$TOPDIR/SPECS/ostree.spec"; then
        sed -i 's/--with-selinux/--without-selinux/' "$TOPDIR/SPECS/ostree.spec"
      else
        echo "WARNING: no --with-selinux flag found in spec; appending --without-selinux to %configure"
        sed -i '/^%configure/ s/$/ \\\n           --without-selinux/' "$TOPDIR/SPECS/ostree.spec"
      fi
      echo "-- %configure line(s) now:"
      grep -n 'configure' "$TOPDIR/SPECS/ostree.spec" | grep -i selinux || grep -n '%configure' "$TOPDIR/SPECS/ostree.spec"

      # ── 3. Install BuildRequires ─────────────────────────────────────────────
      echo "== Installing BuildRequires =="
      dnf -y builddep \
        --define "_topdir $TOPDIR" \
        --define "_sourcedir $TOPDIR/SOURCES" \
        "$TOPDIR/SPECS/ostree.spec" >/dev/null

      # ── 4. Build ─────────────────────────────────────────────────────────────
      echo "== rpmbuild =="
      rpmbuild -bb \
        --define "_topdir $TOPDIR" \
        --define "_sourcedir $TOPDIR/SOURCES" \
        "$TOPDIR/SPECS/ostree.spec" 2>&1 | tee "$CI_PROJECT_DIR/rpmbuild.log" || \
      { tail -200 "$CI_PROJECT_DIR/rpmbuild.log" >&2; exit 1; }

      # ── 5. Upload to rakurpm ─────────────────────────────────────────────────
      UPLOAD_URL="https://$RAKURPM_IP$ADMIN/api/repos/$TARGET_REPO/packages"
      echo "== Upload endpoint: $UPLOAD_URL =="
      : > /tmp/built_names
      : > /tmp/uploaded_files
      uploaded=0
      for rpm in $(find "$TOPDIR/RPMS" -type f -name '*.rpm' \
                     ! -name '*-debuginfo-*' ! -name '*-debugsource-*'); do
        echo "↑ $(basename "$rpm")"
        touch /tmp/rpm_resp
        code=$(curl -k -s -o /tmp/rpm_resp -w '%{http_code}' \
          -H "Authorization: Bearer $RAKURPM_TOKEN" \
          -F "file=@${rpm}" \
          -F "source=GitLab CI/CD" \
          "$UPLOAD_URL") || code=000
        echo "   HTTP $code"
        if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
          echo "   ----- response body -----"; head -c 500 /tmp/rpm_resp || true; echo
          exit 1
        fi
        rpm -qp --nosignature --qf '%{NAME}\n' "$rpm" >> /tmp/built_names 2>/dev/null || true
        echo "   response: $(cat /tmp/rpm_resp)"
        jq -r '.package // empty' /tmp/rpm_resp >> /tmp/uploaded_files 2>/dev/null || true
        uploaded=$((uploaded + 1))
      done
      [ "$uploaded" -gt 0 ] || { echo "ERROR: no RPMs built"; exit 1; }
      echo "== Uploaded $uploaded package(s) to '$TARGET_REPO' =="

      # ── 6. Prune previous versions ───────────────────────────────────────────
      echo "== Pruning previous versions in '$TARGET_REPO' =="
      curl -k -s -H "Authorization: Bearer $RAKURPM_TOKEN" \
        "https://$RAKURPM_IP$ADMIN/api/repos/$TARGET_REPO" -o /tmp/repo.json || true
      jq -r '.packages[].name' /tmp/repo.json > /tmp/repo_files 2>/dev/null || : > /tmp/repo_files
      : > /tmp/to_delete
      while read -r name; do
        [ -n "$name" ] || continue
        while read -r f; do
          grep -qxF "$f" /tmp/uploaded_files || echo "$f" >> /tmp/to_delete
        done < <(grep -E "^${name}-[0-9]" /tmp/repo_files 2>/dev/null || true)
      done < <(sort -u /tmp/built_names)
      if [ -s /tmp/to_delete ]; then
        sort -u /tmp/to_delete -o /tmp/to_delete
        echo "Deleting $(wc -l < /tmp/to_delete) old package(s):"; sed 's/^/   - /' /tmp/to_delete
        FILES_JSON=$(jq -R -s 'split("\n") | map(select(length>0))' /tmp/to_delete)
        curl -k -s -X POST \
          -H "Authorization: Bearer $RAKURPM_TOKEN" -H "Content-Type: application/json" \
          --data "{\"files\": $FILES_JSON}" \
          "https://$RAKURPM_IP$ADMIN/api/repos/$TARGET_REPO/packages/delete" || true
      else
        echo "No previous versions to prune."
      fi

  artifacts:
    paths:
      - rpmbuild/RPMS/
      - rpmbuild.log
      - full-build.log
    when: always
    expire_in: 1 week

sync:repos:
  stage: sync
  image: alpine:latest
  tags: [saas-linux-small-amd64]
  needs:
    - job: build:rpm
      optional: true
  script:
    - apk add --no-cache curl
    - ADMIN=${RAKURPM_ADMIN_PREFIX:-/backend}
    - echo "== Triggering sync for all pending repos =="
    - |
      curl -k -sf -X POST \
        -H "Authorization: Bearer $RAKURPM_TOKEN" \
        "https://$RAKURPM_IP$ADMIN/api/sync-pending"
    - echo "== Sync complete =="
