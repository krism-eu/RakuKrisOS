# rum's main config file — see `man dnf.conf` for background; rum
# recognizes a subset of the same [main] options, in the same format.
#
# Every option below is commented out at its rum-internal default; uncomment
# and edit to override.

[main]
#cachedir=/var/cache/rum
#reposdir=/etc/yum.repos.d
#keepcache=0
#assumeyes=0
#gpgcheck=1
#best=1
#exclude=
#includepkgs=
#metadata_expire=172800
#retries=10
#timeout=30
#max_parallel_downloads=3
#skip_if_unavailable=0
#clean_requirements_on_remove=1
#installroot=/
