name: Build and Publish RakuKrisOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Containerfile
      - build_files/**
      - config/**
      - .github/workflows/build.yml
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: rakukrisos-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Buildah
        run: |
          set -euxo pipefail
          # GitHub's Ubuntu image can carry third-party apt sources. They are
          # irrelevant to this build and a transient bad index (e.g. Chrome)
          # must not prevent Buildah from being installed from Ubuntu itself.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends buildah
          buildah --version

      - name: Normalize image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Build OCI image
        run: |
          set -euxo pipefail
          sudo buildah bud \
            --pull=always \
            --format oci \
            --build-arg FEDORA_VERSION=44 \
            --tag "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            -f Containerfile .

      - name: Validate image contents
        run: |
          set -euxo pipefail
          sudo buildah from --name rakukrisos-validation "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

          sudo buildah run rakukrisos-validation -- rpm -q \
            bootc ostree rakuos-core rakuos-rum rum-dnf-shim \
            plasma-workspace plasma-desktop kwin \
            plasma-login-manager kcm-plasmalogin kde-settings-plasmalogin \
            pipewire-pulseaudio \
            glibc-langpack-en glibc-langpack-it langpacks-core-en langpacks-core-it \
            google-noto-sans-fonts google-noto-sans-mono-fonts google-noto-color-emoji-fonts

          sudo buildah run rakukrisos-validation -- sh -euxc '
            test -x /usr/bin/rum
            test -r /etc/rum/rum.conf
            grep -q "install_weak_deps=0" /etc/rum/rum.conf
            grep -q "clean_requirements_on_remove=0" /etc/rum/rum.conf

            test -e /usr/lib/systemd/system/plasmalogin.service
            test -e /usr/lib/systemd/system/rakuos-overlay-sync.service
            test -e /usr/lib/systemd/system/rakuos-base-protect.service
            test -x /usr/lib/rakuos/initrd/rakuos-overlay-mount
            test -e /usr/lib/dracut/modules.d/90rakuos-overlay/module-setup.sh

            test -s /usr/share/rakuos/de-name
            grep -qx plasma /usr/share/rakuos/de-name
            test -s /usr/share/rakuos/protected-packages.txt
            test -s /usr/share/rakuos/base-manifest.txt
            test -s /usr/share/factory/var/lib/rakuos/packages.list
            grep -qx dolphin /usr/share/factory/var/lib/rakuos/packages.list
            grep -qx konsole /usr/share/factory/var/lib/rakuos/packages.list
            grep -qx kate /usr/share/factory/var/lib/rakuos/packages.list

            test -d /usr/share/icons/breeze
            ! rpm -q glibc-all-langpacks >/dev/null 2>&1
          '

          # bootc lint is a deployment-oriented validation, not just an RPM check.
          sudo buildah run rakukrisos-validation -- bootc container lint
          sudo buildah rm rakukrisos-validation

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push immutable image
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          sudo buildah push \
            --format oci \
            --compression-format zstd \
            --compression-level 10 \
            "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Push latest image
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          sudo buildah push \
            --format oci \
            --compression-format zstd \
            --compression-level 10 \
            "${REGISTRY}/${IMAGE_NAME}:latest"

      - name: Print bootc switch command
        if: github.event_name != 'pull_request'
        run: |
          echo "Image: ${REGISTRY}/${IMAGE_NAME}:latest"
          echo "Switch: sudo bootc switch ${REGISTRY}/${IMAGE_NAME}:latest"
