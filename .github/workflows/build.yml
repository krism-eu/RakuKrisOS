name: Build and Publish RakuKrisOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Containerfile
      - build_files/**
      - config/**
      - .github/workflows/build.yml
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: rakukrisos-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah

      - name: Normalize image name
        run: echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Build OCI image
        run: |
          set -euxo pipefail
          sudo buildah bud \
            --pull=always \
            --format oci \
            --build-arg FEDORA_VERSION=44 \
            --tag "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            -f Containerfile .

      - name: Validate image contents
        run: |
          set -euxo pipefail
          sudo buildah from --name rakukrisos-validation "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"
          sudo buildah run rakukrisos-validation -- rpm -q \
            bootc ostree rakuos-core rakuos-rum plasma-workspace kwin sddm
          sudo buildah run rakukrisos-validation -- \
            sh -c 'test -x /usr/bin/rum && test -r /etc/rum/rum.conf && grep -q "install_weak_deps=0" /etc/rum/rum.conf && grep -q "clean_requirements_on_remove=0" /etc/rum/rum.conf'
          sudo buildah rm rakukrisos-validation

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push performs the actual layer compression. Use OCI + zstd explicitly
      # so bootc pulls a deterministic, compact image instead of depending on
      # the runner's containers.conf defaults.
      - name: Push immutable image
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          sudo buildah push \
            --format oci \
            --compression-format zstd \
            --compression-level 10 \
            "${REGISTRY}/${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Push latest image
        if: github.event_name != 'pull_request'
        run: |
          set -euxo pipefail
          sudo buildah push \
            --format oci \
            --compression-format zstd \
            --compression-level 10 \
            "${REGISTRY}/${IMAGE_NAME}:latest"

      - name: Print bootc switch command
        if: github.event_name != 'pull_request'
        run: |
          echo "Image: ${REGISTRY}/${IMAGE_NAME}:latest"
          echo "Switch: sudo bootc switch ${REGISTRY}/${IMAGE_NAME}:latest"
