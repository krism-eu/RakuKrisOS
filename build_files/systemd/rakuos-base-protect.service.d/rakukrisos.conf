[Unit]
# rakuos-overlay-mount.service exists only in the initramfs. Reset the upstream
# host-unit dependency after switch-root and order the daemon after local mounts.
After=
Wants=
After=local-fs.target
ConditionPathExists=/usr/share/rakuos/base-manifest.txt

[Service]
# A clean exit must not create an endless restart loop.
Restart=on-failure
